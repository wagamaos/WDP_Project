<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landed | Log in or Sign up</title>
  <meta name="description" content="Log in or create your free Landed account to track quests, earn XP and settle into student life faster.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23F5B73B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="Css/common.css">
  <link rel="stylesheet" href="Css/login.css">
  <link rel="stylesheet" href="Css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#auth-form">Skip to form</a>

  <div class="auth-shell">

    <!-- ===== LEFT PANEL ===== -->
    <section class="auth-left" aria-label="About Landed">
      <a class="auth-brand" href="index.html" aria-label="Landed – home">
        <span class="auth-brand-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
        </span>
        <span class="auth-brand-name">Landed</span>
      </a>
      <div class="auth-hero">
        <h2>Land softly.<br>Settle in faster.</h2>
        <p>Your campus life, deadlines and budget in one place.</p>
        <div class="auth-features">
          <div class="auth-feature">
            <div class="auth-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <span>Earn XP for every step you complete</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
            </div>
            <span>Climb the monthly leaderboard</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            </div>
            <span>Redeem points for real treats</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== RIGHT PANEL ===== -->
    <section class="auth-right" id="auth-form" aria-label="Account access" tabindex="-1">
      <div class="auth-form-wrap" id="login-root"></div>
    </section>

  </div>

  <script type="module" src="/src/login/main.jsx"></script>
</body>
</html>
