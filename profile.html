<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landed | Sarah Tan – Profile</title>
  <meta name="description" content="View and manage your Landed profile, badges, contribution history and privacy settings.">
  <link rel="stylesheet" href="Css/common.css">
  <link rel="stylesheet" href="Css/profile.css">
  <link rel="stylesheet" href="Css/responsive.css">
  <script src="js/page-guard.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell">

    <!-- ===== SIDEBAR ===== -->
    <nav class="sidebar" aria-label="Main navigation">
      <a class="sidebar-logo" href="index.html" aria-label="Landed – home">
        <span class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
        </span>
        <span class="sidebar-logo-name">Landed</span>
      </a>

      <div class="sidebar-nav">
        <a href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
          <span>Home</span>
        </a>
        <a href="forum.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Forum</span>
        </a>
        <a href="events.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Events</span>
        </a>
        <a href="rewards.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
          <span>Rewards</span>
        </a>
        <a href="profile.html" class="active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </a>
        <a href="school.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>School Tracker</span>
        </a>
        <a href="budget.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Budget Tracker</span>
        </a>
        <a href="onboarding.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Arrival Checklist</span>
        </a>
        <a href="login.html" id="logout-link" class="logout-link" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
        </a>
      </div>
    </nav>

    <!-- ===== MAIN CANVAS ===== -->
    <main class="main-canvas" id="main" tabindex="-1">

      <!-- Profile header card -->
      <div class="profile-header-card" aria-label="Profile header">
        <div class="profile-avatar" id="profile-avatar" aria-hidden="true"></div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name"></div>
          <div class="profile-sub" id="profile-sub"></div>
          <div class="profile-xp-bar-track" id="profile-xp-track" role="progressbar" aria-valuenow="12.5" aria-valuemin="0" aria-valuemax="100" aria-label="XP progress to next level">
            <div class="profile-xp-bar-fill" id="profile-xp-fill"></div>
          </div>
          <div class="profile-xp-label" id="profile-xp-label"></div>
        </div>
        <div class="profile-edit-btn">
          <button class="btn btn-outline btn-sm" id="edit-profile-btn" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;">
            Edit profile
          </button>
        </div>
      </div>

      <!-- About + Contribution grid -->
      <div class="profile-grid">

        <!-- About -->
        <div class="card" aria-labelledby="about-heading">
          <div class="card-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <h2 id="about-heading">About</h2>
          </div>
          <p class="about-section-bio" id="profile-bio"></p>

          <div class="about-row">
            <div class="about-row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div>
              <div class="about-row-label">Home country</div>
              <div class="about-row-value" id="profile-country"></div>
            </div>
          </div>

          <div class="about-row">
            <div class="about-row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>
            </div>
            <div>
              <div class="about-row-label">Student status</div>
              <div class="about-row-value" id="profile-student-status"></div>
            </div>
          </div>

          <div class="about-row">
            <div class="about-row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <div>
              <div class="about-row-label">Field of study</div>
              <div class="about-row-value" id="profile-major"></div>
            </div>
          </div>
        </div>

        <!-- Contribution history -->
        <div class="card" aria-labelledby="contrib-heading">
          <div class="card-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <h2 id="contrib-heading">Contribution history</h2>
          </div>

          <div class="contrib-row">
            <div class="contrib-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span class="contrib-label">Forum posts</span>
            <span class="contrib-count">0</span>
          </div>

          <div class="contrib-row">
            <div class="contrib-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span class="contrib-label">Comments</span>
            <span class="contrib-count">0</span>
          </div>

          <div class="contrib-row">
            <div class="contrib-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <span class="contrib-label">Events attended</span>
            <span class="contrib-count">0</span>
          </div>

          <div class="contrib-row">
            <div class="contrib-icon gold-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <span class="contrib-label">Points earned</span>
            <span class="contrib-count gold-count" id="profile-points">50</span>
          </div>
        </div>

      </div><!-- /.profile-grid -->

      <!-- Badges section (full width) -->
      <div class="card" aria-labelledby="badges-heading">
        <div class="card-title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
          <h2 id="badges-heading">Badges</h2>
          <span class="badge-count" id="profile-badge-count">&middot; 0 of 9</span>
        </div>

        <div class="badges-grid" id="profile-badges-grid" aria-label="Your badges"></div>
      </div><!-- /.badges card -->

    </main>
    <dialog class="profile-dialog" id="profile-dialog" aria-labelledby="profile-dialog-title">
      <form id="profile-edit-form">
        <h2 id="profile-dialog-title">Edit profile</h2>
        <p id="profile-message" class="auth-message" role="status" aria-live="polite" hidden></p>
        <label for="edit-name">Full name</label>
        <input id="edit-name" name="name" type="text" autocomplete="name" required maxlength="80">
        <label for="edit-country">Home country</label>
        <input id="edit-country" name="country" type="text" autocomplete="country-name" required maxlength="80">
        <label for="edit-major">Field of study</label>
        <input id="edit-major" name="major" type="text" maxlength="100">
        <label for="edit-bio">About you</label>
        <textarea id="edit-bio" name="bio" rows="4" maxlength="300"></textarea>
        <div class="profile-dialog-actions">
          <button type="button" class="btn btn-outline" id="close-profile-dialog">Cancel</button>
          <button type="submit" class="btn btn-gold" id="save-profile-btn">Save changes</button>
        </div>
      </form>
    </dialog>
  </div><!-- /.app-shell -->

  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
