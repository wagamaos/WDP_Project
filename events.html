<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landed | Events</title>
  <meta name="description" content="Discover, join and make the most of your campus life. Every RSVP and check-in earns points on Landed.">
  <link rel="stylesheet" href="Css/common.css">
  <link rel="stylesheet" href="Css/events.css">
  <link rel="stylesheet" href="Css/responsive.css">
  <script src="js/page-guard.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell">

    <!-- ===== SIDEBAR ===== -->
    <nav class="sidebar" aria-label="Main navigation">
      <a class="sidebar-logo" href="index.html" aria-label="Landed – home">
        <span class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
        </span>
        <span class="sidebar-logo-name">Landed</span>
      </a>

      <div class="sidebar-nav">
        <a href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
          <span>Home</span>
        </a>
        <a href="forum.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Forum</span>
        </a>
        <a href="events.html" class="active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Events</span>
        </a>
        <a href="rewards.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
          <span>Rewards</span>
        </a>
        <a href="profile.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </a>
        <a href="school.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>School Tracker</span>
        </a>
        <a href="budget.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Budget Tracker</span>
        </a>
        <a href="onboarding.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Arrival Checklist</span>
        </a>
        <a href="login.html" class="logout-link" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
        </a>
      </div>
    </nav>

    <!-- ===== MAIN CANVAS ===== -->
    <main class="main-canvas" id="main" tabindex="-1">

      <!-- Page header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Events</h1>
          <p class="page-sub">Discover, join and make the most of your campus life. Every RSVP and check-in earns points.</p>
        </div>
        <div class="events-search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="events-search" placeholder="Search events" aria-label="Search events">
        </div>
      </div>

      <!-- Filter row -->
      <div class="events-filter-row">
        <div class="forum-filter-tabs" role="group" aria-label="Filter events by time">
          <button class="forum-tab active"
                  aria-pressed="true"
                  data-filter="upcoming">
            Upcoming
          </button>

          <button class="forum-tab"
                  aria-pressed="false"
                  data-filter="rsvps">
            My RSVPs
          </button>

          <button class="forum-tab"
                  aria-pressed="false"
                  data-filter="past">
            Past
          </button>
        </div>
        <div class="events-type-tabs" role="group" aria-label="Event type filter">
          <button class="events-type-btn active" id="etype-all" data-type="all">All</button>
          <button class="events-type-btn" id="etype-su" data-type="Student Union">Student Union</button>
          <button class="events-type-btn" id="etype-sr" data-type="Student Run">Student Run</button>
          <button class="events-type-btn" id="etype-free" data-type="Free">Free</button>
          <button class="events-type-btn" id="etype-u10" data-type="Under 10">Under 10</button>
        </div>
      </div>

      <!-- Events grid -->
      <section class="events-grid" id="events-root" aria-label="Events listing">
      </section>
      <!-- /.events-grid -->

    </main>
  </div><!-- /.app-shell -->

  <script src="js/auth.js"></script>
  <script type="module" src="react-dist/events.js"></script>
  <script src="js/session-nav.js"></script>
</body>
</html>
