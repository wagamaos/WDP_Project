<!--
  Landed general notification email (EmailJS template).
  Used for every forum and rewards email; the app fills in the variables below.
  Paste everything from the next line down into the EmailJS template's Content (code view).

  {{heading}} {{intro}} {{button_label}} {{button_url}} {{footer_note}} {{site_url}} are plain text.
  {{{details_html}}} uses THREE braces because it is HTML built (and escaped) by src/shared/email.js.
-->
<div style="margin:0;padding:24px 12px;background-color:#F4F7FE;font-family:system-ui,'Segoe UI',Arial,sans-serif;font-size:16px;color:#0E2466;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-radius:18px;overflow:hidden;">

    <!-- Logo bar -->
    <tr>
      <td style="background-color:#1B44B8;padding:20px 28px;">
        <a href="{{site_url}}" target="_blank" style="text-decoration:none;outline:none;">
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td width="44" height="44" align="center" valign="middle" style="width:44px;height:44px;background-color:#F5B73B;border-radius:12px;font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:900;line-height:44px;color:#3A2800;">&#8593;</td>
              <td style="padding-left:14px;font-size:26px;font-weight:800;color:#FFFFFF;letter-spacing:-0.5px;">Landed</td>
            </tr>
          </table>
        </a>
      </td>
    </tr>

    <!-- Heading + intro -->
    <tr>
      <td style="padding:32px 28px 8px 28px;">
        <div style="font-size:24px;font-weight:800;color:#0E2466;line-height:1.3;">{{heading}}</div>
        <p style="margin:12px 0 0 0;font-size:16px;line-height:1.6;color:#3A4A6B;">{{intro}}</p>
      </td>
    </tr>

    <!-- Details (quote and/or summary table) -->
    <tr>
      <td style="padding:18px 28px 4px 28px;">{{{details_html}}}</td>
    </tr>

    <!-- Button -->
    <tr>
      <td style="padding:18px 28px 8px 28px;">
        <a href="{{button_url}}" target="_blank" style="display:inline-block;text-decoration:none;outline:none;background-color:#F5B73B;color:#3A2800;font-size:16px;font-weight:700;padding:13px 30px;border-radius:999px;">{{button_label}} &rarr;</a>
      </td>
    </tr>

    <!-- Sign-off -->
    <tr>
      <td style="padding:22px 28px 28px 28px;font-size:15px;line-height:1.6;color:#3A4A6B;">
        Questions? Just reply to this email or write to
        <a href="mailto:welcome.landed@gmail.com" style="text-decoration:none;outline:none;color:#1B44B8;font-weight:600;">welcome.landed@gmail.com</a>.<br /><br />
        Warmly,<br /><strong style="color:#0E2466;">The Landed Team</strong> &#128153;
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="background-color:#F4F7FE;padding:16px 28px;text-align:center;font-size:12px;line-height:1.5;color:#8A97B3;">
        {{footer_note}}
      </td>
    </tr>

  </table>
</div>
